name: Community bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions: {}

jobs:
  welcome:
    uses: Scintela/.github/.github/workflows/welcome.yml@main
    permissions:
      issues: write
      pull-requests: write

  label:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const rules = {
              'area: matrix': /(matrix|矩阵|点亮|lightboard|benchmark|基准|跑分|硬件|hardware)/i,
              'area: docs': /(docs?|文档|站点|site|typo|教程|guide|导航|nav)/i,
              'area: design': /(logo|图标|icon|favicon|配色|brand|品牌)/i,
              'kind: bug': /(bug|错误|失效|broken|无法|fail(ed)?|404)/i,
              'kind: question': /(question|提问|咨询|how to|怎么|能否|可以吗)/i
            };
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`;
            const existing = (await github.rest.issues.listLabelsOnIssue(context.repo, { issue_number: context.issue.number })).data.map(l => l.name);
            const add = Object.entries(rules)
              .filter(([name]) => !existing.includes(name))
              .filter(([, re]) => re.test(text))
              .map(([name]) => name);
            if (add.length) {
              await github.rest.issues.addLabels(context.repo, { issue_number: context.issue.number, labels: add });
              core.info(`labels applied: ${add.join(', ')}`);
            }
